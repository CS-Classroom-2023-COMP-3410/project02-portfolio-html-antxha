<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Antony</title>
  <meta name="description" content="Reach out to Antony Ha through this contact form.">
</head>
<body bgcolor="#F0FFF0">
  <h1>Contact Me</h1>
  <img src="https://images.icon-icons.com/2070/PNG/512/envelope_icon_126482.png" alt="Envelope" width="200">
  <form action="mailto:Antony.Ha@du.edu" method="post" enctype="text/plain">
    <label for="name">Your Name:</label><br>
    <input type="text" id="name" name="name"><br><br>

    <label for="email">Your Email:</label><br>
    <input type="email" id="email" name="email"><br><br>

    <label for="message">Message:</label><br>
    <textarea id="message" name="message" rows="5" cols="40"></textarea><br><br>

    <input type="submit" value="Send Email">
  </form>
  <br>
  <a href="index.html">Back to Home</a>
</body>
</html>
